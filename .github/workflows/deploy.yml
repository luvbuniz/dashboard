name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [claude/amys-command-center-6tyw34, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Optional: put the contents of your config.js into a repo Actions
      # secret named DASHBOARD_CONFIG and it gets shipped with the site.
      # ⚠️ On a PUBLIC Pages site, config.js is world-readable — don't put
      # the Telegram bot token there unless you accept that. The dashboard
      # works fine with no config at all (pings are just skipped).
      - name: Inject config.js from secret (if set)
        env:
          DASHBOARD_CONFIG: ${{ secrets.DASHBOARD_CONFIG }}
        run: |
          if [ -n "$DASHBOARD_CONFIG" ]; then
            printf '%s' "$DASHBOARD_CONFIG" > dist/config.js
            echo "config.js injected from secret"
          else
            echo "no DASHBOARD_CONFIG secret — skipping (dashboard runs without it)"
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
