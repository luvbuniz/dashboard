<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>🤖 Agent Ops — Command Center</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2a323d;
    --tx:#e6edf3; --dim:#9aa7b4; --faint:#66727f;
    --green:#30d158; --blue:#64d2ff; --amber:#ffd60a; --red:#ff453a; --purple:#a78bfa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 24px}
  a{color:var(--blue);text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:14px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
  header h1{font-size:19px;margin:0;letter-spacing:.2px}
  .sync{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12.5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
  .dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
  .dot.err{background:var(--red);box-shadow:0 0 6px var(--red)}
  button{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:6px 11px;cursor:pointer}
  button:active{transform:translateY(1px)}
  .board{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px;margin-bottom:14px;flex-wrap:wrap}
  .stat{flex:1;min-width:120px}
  .stat .k{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
  .stat .v{font-size:20px;font-weight:600;margin-top:2px}
  .roster{display:flex;flex-direction:column;gap:9px}
  .card{display:flex;align-items:flex-start;gap:12px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:12px 13px;position:relative}
  .card.dim{opacity:.62}
  .av{width:42px;height:42px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .who{flex:1;min-width:0}
  .who .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .name{font-weight:600}
  .gw{font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:6px;
    padding:1px 6px;text-transform:uppercase;letter-spacing:.4px}
  .role{color:var(--dim);font-size:12.5px;margin-top:1px}
  .task{margin-top:6px;font-size:13.5px;color:var(--tx)}
  .task .lbl{color:var(--faint)}
  .beat{margin-top:5px;font-size:11.5px;color:var(--faint)}
  .chip{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    padding:3px 8px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
  .chip.working{color:var(--green);background:rgba(48,209,88,.12);border-color:rgba(48,209,88,.3)}
  .chip.idle{color:var(--blue);background:rgba(100,210,255,.12);border-color:rgba(100,210,255,.28)}
  .chip.needs-you{color:#000;background:var(--amber)}
  .chip.offline{color:var(--faint);background:rgba(120,130,140,.1);border-color:var(--line)}
  .chip.stale{color:var(--amber);background:rgba(255,214,10,.1);border-color:rgba(255,214,10,.3)}
  .pulse{position:absolute;top:13px;right:13px;width:8px;height:8px;border-radius:50%;background:var(--green)}
  .pulse.live{animation:pl 1.6s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(48,209,88,.5)}50%{opacity:.6;box-shadow:0 0 0 6px rgba(48,209,88,0)}}
  .msg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;color:var(--dim)}
  .msg h2{color:var(--tx);font-size:16px;margin:0 0 8px}
  input[type=password],input[type=text]{width:100%;font:inherit;color:var(--tx);background:var(--bg);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:8px 0}
  .foot{margin-top:16px;color:var(--faint);font-size:11.5px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🤖 Agent Ops</h1>
    <div class="sync">
      <span id="dot" class="dot"></span>
      <span id="synced">connecting…</span>
      <button id="refresh">↻</button>
    </div>
  </header>
  <div id="root"><div class="msg">Loading…</div></div>
  <div class="foot"><a href="./">← Command Center</a> · auto-refresh 45s · reads <code>buni/agent-status.json</code></div>
</div>

<script>
const REPO="luvbuniz/buni", FILE="agent-status.json", POLL=45000, STALE_MIN=10;
const $=s=>document.querySelector(s);

function getToken(){
  try{const c=JSON.parse(localStorage.getItem("amys-cc-connection")||"{}");
    if(c.HERMES_PULL_TOKEN) return c.HERMES_PULL_TOKEN;}catch(e){}
  return localStorage.getItem("ops-buni-token")||"";
}
function saveToken(t){localStorage.setItem("ops-buni-token",t.trim());}

function ago(iso){
  if(!iso) return "—";
  const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  if(s<60) return Math.round(s)+"s ago";
  if(s<3600) return Math.round(s/60)+"m ago";
  if(s<86400) return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}
function isStale(a){
  if(a.status==="offline"||!a.lastHeartbeat) return false;
  return (Date.now()-new Date(a.lastHeartbeat).getTime())/60000 > STALE_MIN;
}
function esc(s){return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function tokenPrompt(err){
  $("#root").innerHTML=`<div class="msg"><h2>Connect to your agent feed</h2>
    Paste your <b>buni read token</b> (the same fine-grained PAT your dashboard uses,
    <code>HERMES_PULL_TOKEN</code>). It's stored only in this browser, never sent anywhere but GitHub.
    ${err?`<div style="color:var(--red);margin-top:6px">${esc(err)}</div>`:""}
    <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off"/>
    <button id="save">Connect</button></div>`;
  $("#save").onclick=()=>{const v=$("#tok").value.trim();if(v){saveToken(v);load();}};
  $("#tok").onkeydown=e=>{if(e.key==="Enter")$("#save").click();};
}

function render(d){
  const sb=d.scoreboard||{}, sp=d.sprint||{};
  let board=`<div class="board">
    <div class="stat"><div class="k">Sprint</div><div class="v" style="font-size:15px">${esc(sp.label||"—")}</div></div>
    <div class="stat"><div class="k">Spent</div><div class="v">$${esc(sb.spent??0)}</div></div>
    <div class="stat"><div class="k">Revenue</div><div class="v">$${esc(sb.revenue??0)}</div></div>
    <div class="stat"><div class="k">Listings live</div><div class="v">${esc(sb.listingsLive??0)}</div></div>
  </div>`;
  const rows=(d.agents||[]).map(a=>{
    const stale=isStale(a);
    const cls=stale?"stale":(a.status||"offline");
    const label=stale?"stale":(a.status||"offline");
    const off=a.status==="offline";
    const live=a.status==="working"&&!stale;
    return `<div class="card ${off?"dim":""}">
      ${live?'<span class="pulse live"></span>':""}
      <div class="av">${esc(a.emoji||"🤖")}</div>
      <div class="who">
        <div class="top">
          <span class="name">${esc(a.name)}</span>
          ${a.gateway&&a.gateway!=="—"?`<span class="gw">${esc(a.gateway)}</span>`:""}
          <span class="chip ${cls}">${esc(label)}</span>
        </div>
        <div class="role">${esc(a.role||"")}</div>
        ${a.task?`<div class="task"><span class="lbl">▸ </span>${esc(a.task)}</div>`:""}
        <div class="beat">❤ ${ago(a.lastHeartbeat)}${a.lastOutput?` · last: ${esc(a.lastOutput)}`:""}</div>
      </div>
    </div>`;
  }).join("");
  $("#root").innerHTML=board+`<div class="roster">${rows}</div>`;
}

async function load(){
  const token=getToken();
  if(!token){tokenPrompt();return;}
  try{
    const res=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}?t=${Date.now()}`,
      {headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github.raw+json"},cache:"no-store"});
    if(res.status===401||res.status===403){saveToken("");tokenPrompt("Token rejected — check it has read access to the buni repo.");markErr();return;}
    if(res.status===404){$("#root").innerHTML=`<div class="msg">agent-status.json not found in buni (404). The feed hasn't been published yet.</div>`;markErr();return;}
    if(!res.ok) throw new Error("GitHub said "+res.status);
    let data=await res.json();
    if(data&&typeof data.content==="string"&&data.encoding==="base64"){
      data=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(data.content.replace(/\s/g,"")),c=>c.charCodeAt(0))));
    }
    render(data);
    $("#dot").className="dot ok";
    $("#synced").textContent="updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  }catch(e){
    markErr();
    $("#synced").textContent="offline — retrying";
    if(!document.querySelector(".card")) $("#root").innerHTML=`<div class="msg">Couldn't reach the feed (${esc(e.message)}). Retrying…</div>`;
  }
}
function markErr(){$("#dot").className="dot err";}

$("#refresh").onclick=load;
load();
setInterval(load,POLL);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load();});
</script>
</body>
</html>
