<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0b0a" />
  <title>Amy — today</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" href="./favicon.svg?v=8" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/crescent-180.png?v=8" />
  <link rel="manifest" href="./manifest.webmanifest?v=8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#0c0b0a; --panel:#151413; --elev:#1d1b19; --ink:#f3efe8; --muted:#a39c91; --faint:#756e64;
      --line:rgba(243,239,232,.09); --copper:#d0834f; --copper-dim:rgba(208,131,79,.16); --ok:#86ad72; --r:12px;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#faf7f2; --panel:#ffffff; --elev:#f3eee6; --ink:#24201c; --muted:#6c645a; --faint:#958c80;
        --line:rgba(36,32,28,.1); --copper:#b5652f; --copper-dim:rgba(181,101,47,.12); --ok:#4f8a3c; }
    }
    * { box-sizing:border-box; }
    html,body { margin:0; background:var(--bg); color:var(--ink); }
    body { font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%; }
    .wrap { max-width:1080px; margin:0 auto; padding:20px 16px calc(40px + env(safe-area-inset-bottom)); }
    header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:8px 16px; }
    .kicker { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:500; }
    h1 { font-family:Newsreader,Georgia,serif; font-weight:500; font-size:clamp(28px,5vw,38px); letter-spacing:-.02em; margin:2px 0 0; line-height:1.05; }
    .sync { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; }
    .dot.ok { background:var(--ok); } .dot.wait { background:var(--copper); }
    .msg { color:var(--muted); margin:10px 0 0; }
    .quote { font-family:Newsreader,Georgia,serif; font-size:19px; line-height:1.35; margin:20px 0 4px; max-width:34em; transition:opacity .4s; }
    .quote cite { display:block; font-family:"IBM Plex Sans",sans-serif; font-style:normal; font-size:12px; color:var(--faint); margin-top:4px; }
    .linkbtn { background:none; border:0; color:var(--faint); font:inherit; font-size:12px; padding:6px 0; cursor:pointer; }
    h2 { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:28px 0 10px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; }
    .frog { border-color:var(--copper); background:linear-gradient(0deg,var(--copper-dim),var(--copper-dim)),var(--panel); margin-top:18px; }
    .frog .kicker { color:var(--copper); }
    .task { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; background:none; border:0; color:inherit; font:inherit; padding:9px 0; cursor:pointer; -webkit-tap-highlight-color:transparent; min-height:44px; }
    .task + .task { border-top:1px solid var(--line); }
    .box { flex:none; width:24px; height:24px; border-radius:7px; border:2px solid var(--faint); margin-top:1px; display:grid; place-items:center; transition:all .15s; }
    .task.done .box { background:var(--ok); border-color:var(--ok); }
    .task.done .box::after { content:""; width:6px; height:11px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg) translate(-1px,-1px); }
    .task.done .label { text-decoration:line-through; color:var(--faint); }
    .label { display:block; }
    .note { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
    .lane-h { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px; margin-bottom:4px; }
    .lane-h b { font-weight:600; }
    .tag { font-size:10px; letter-spacing:.08em; font-weight:600; color:var(--copper); background:var(--copper-dim); padding:3px 7px; border-radius:99px; }
    .count { font-size:12px; color:var(--faint); }
    .facts { margin:8px 0 0; padding:0; list-style:none; font-size:14px; color:var(--muted); }
    .facts li { padding:5px 0; border-top:1px dashed var(--line); }
    .facts li.wait::before { content:"⏳ "; }
    .stuck { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
    .btn { background:var(--copper); color:#fff; border:0; border-radius:999px; font:inherit; font-weight:500; padding:10px 18px; min-height:44px; cursor:pointer; }
    .pick { flex:1 1 240px; }
    .week { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
    .day { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; }
    .day.today { border-color:var(--copper); }
    .day .d { font-weight:600; } .day .dt { color:var(--faint); font-size:12px; margin-left:4px; }
    .day ul { margin:6px 0 0; padding-left:16px; } .day .trash { color:var(--faint); font-size:12px; margin-top:6px; }
    .empty { color:var(--muted); font-size:14px; }

    /* Call leads */
    .calls-top { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 12px; }
    .calls-prog { font-size:14px; color:var(--muted); } .calls-prog b { color:var(--ink); }
    .pbar { height:6px; background:var(--elev); border-radius:99px; overflow:hidden; margin:8px 0 2px; }
    .pbar i { display:block; height:100%; background:var(--ok); transition:width .3s; }
    .csec { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--copper); font-weight:600; margin:18px 0 6px; }
    .call { border:1px solid var(--line); border-radius:10px; padding:12px; margin:8px 0; background:var(--panel); }
    .call.urgent { border-left:4px solid var(--copper); }
    .call.done { background:var(--elev); }
    .call.done .cname { color:var(--muted); }
    .call-h { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline; }
    .ctime { font-weight:600; font-size:14px; color:var(--muted); }
    .cname { font-weight:600; font-size:17px; }
    .crole { font-size:14px; color:var(--muted); }
    .ccomp { font-size:15px; margin-top:2px; }
    .badges { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
    .badge { font-size:11px; font-weight:600; letter-spacing:.04em; padding:3px 8px; border-radius:99px; background:var(--elev); color:var(--muted); border:1px solid var(--line); }
    .badge.urg { background:var(--copper); color:#fff; border-color:var(--copper); }
    .badge.ch { color:var(--copper); background:var(--copper-dim); border-color:transparent; }
    .badge.ok { background:var(--ok); color:#fff; border-color:var(--ok); }
    .phones { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin:6px 0; }
    .tel { display:inline-flex; align-items:center; gap:6px; background:var(--copper); color:#fff; text-decoration:none; font-weight:600; font-size:17px; padding:10px 16px; border-radius:999px; min-height:44px; }
    .tel.sm { background:none; color:var(--copper); font-size:14px; font-weight:500; padding:6px 0; min-height:0; text-decoration:underline; }
    .cmail { font-size:13px; color:var(--muted); word-break:break-all; }
    .cline { font-size:14px; color:var(--muted); margin-top:4px; } .cline b { color:var(--ink); font-weight:600; }
    .who { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:6px 0; }
    .who.wt { border-color:var(--copper); background:var(--copper-dim); }
    .wlab { font-size:14px; margin-bottom:4px; } .wlab b { font-weight:600; } .wlab .k { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--copper); font-weight:700; margin-right:4px; }
    .tel.c2 { background:var(--elev); color:var(--ink); border:1px solid var(--line); font-size:15px; padding:8px 14px; min-height:40px; }
    .badge.tnf { background:var(--elev); color:var(--muted); border-style:dashed; }
    .cnote button.saved { background:var(--ok); border-color:var(--ok); color:#fff; font-weight:600; }
    .cnote button:disabled { opacity:.6; cursor:wait; }
    .nstat.ok { color:var(--ok); font-size:13px; }
    .crec { color:var(--ink); } .crec b { color:var(--copper); }
    .call details { font-size:14px; color:var(--muted); margin-top:4px; } .call summary { cursor:pointer; color:var(--ink); padding:4px 0; }
    .outs { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .out { background:var(--elev); color:var(--ink); border:1px solid var(--line); border-radius:999px; font:inherit; font-size:14px; padding:8px 12px; min-height:40px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .out.on { background:var(--ok); border-color:var(--ok); color:#fff; font-weight:600; }
    .cnote { display:flex; gap:6px; margin-top:8px; }
    .cnote textarea { flex:1; min-height:44px; resize:vertical; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px; font:inherit; font-size:15px; padding:8px 10px; }
    .cnote button { background:var(--elev); color:var(--ink); border:1px solid var(--line); border-radius:8px; font:inherit; font-size:14px; padding:0 12px; cursor:pointer; }
    .cnote input { flex:1; min-height:44px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px; font:inherit; font-size:16px; padding:8px 10px; }
    .nstat { font-size:12px; color:var(--faint); margin-top:3px; min-height:1em; }
    .nstat.err { color:var(--copper); font-size:14px; }
    details.scripts { margin-top:12px; } details.scripts > summary { cursor:pointer; font-weight:600; padding:10px 0; font-size:16px; }
    details.sblk { border-top:1px solid var(--line); } details.sblk > summary { cursor:pointer; padding:12px 0; font-weight:600; font-size:16px; }
    .stext { font-size:18px; line-height:1.55; padding-bottom:12px; } .stext p { margin:0 0 12px; } .stext ul { margin:0 0 12px; padding-left:20px; } .stext li { margin:0 0 8px; }
    .stext h4 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--copper); margin:12px 0 6px; }
    /* Call list + script side panel (two panes on laptop widths, stacked on phones) */
    .csplit { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
    .clist { min-width:0; }
    .spanel { background:var(--elev); border:1px solid var(--line); border-radius:10px; padding:12px 14px; order:-1; }
    .sp-h { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .sp-h b { font-size:15px; }
    .sp-toggle { background:none; border:1px solid var(--line); color:var(--ink); border-radius:999px; font:inherit; font-size:13px; padding:6px 12px; cursor:pointer; }
    .stabs { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 8px; }
    .stab { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:999px; font:inherit; font-size:13px; padding:6px 10px; min-height:34px; cursor:pointer; }
    .stab.on { background:var(--copper); border-color:var(--copper); color:#fff; font-weight:600; }
    .sp-for { font-size:13px; color:var(--muted); margin:2px 0 6px; } .sp-for b { color:var(--ink); }
    .sp-for button { background:none; border:0; color:var(--faint); font:inherit; font-size:12px; cursor:pointer; text-decoration:underline; }
    .sp-title { font-weight:600; font-size:15px; color:var(--copper); margin:6px 0 8px; }
    .spanel .stext mark { background:var(--copper-dim); color:inherit; border-radius:3px; padding:0 2px; }
    .spanel.collapsed .sp-body { display:none; }
    .call { cursor:pointer; }
    .call.active { outline:2px solid var(--copper); outline-offset:1px; }
    @media (min-width:1000px) {
      #calls-sec.split { width:min(1560px, calc(100vw - 32px)); margin-left:calc(50% - min(1560px, calc(100vw - 32px)) / 2); }
      .csplit { grid-template-columns:minmax(0,1fr) minmax(380px,46%); align-items:start; }
      .spanel { order:0; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; overscroll-behavior:contain; }
      .spanel.collapsed .sp-body { display:block; }
      .sp-toggle { display:none; }
    }
    footer { margin-top:32px; font-size:11px; color:var(--faint); }
    @media print {
      :root { --bg:#fff; --panel:#fff; --ink:#000; --muted:#333; --faint:#555; --line:#ccc; --copper:#000; --copper-dim:transparent; }
      .linkbtn,.stuck-sec,.sync,footer,.outs,.cnote,.stabs,.sp-toggle { display:none !important; }
      .wrap { padding:0; max-width:none; } .card,.day { break-inside:avoid; } .task { min-height:0; padding:5px 0; }
      .box { border-color:#000; } .grid { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="kicker" id="kicker"></div><h1 id="heading">Amy — today</h1></div>
    <div class="sync" title="Where your ticks are saved"><span class="dot" id="sdot"></span><span id="stext">Loading…</span></div>
  </header>
  <p class="msg" id="msg"></p>
  <blockquote class="quote" id="quote"></blockquote>
  <button class="linkbtn" id="quote-next" type="button">↻ another quote</button>

  <div class="card frog" id="frog"></div>

  <h2>Today's top 3</h2>
  <div class="card" id="today"></div>

  <section id="calls-sec">
    <h2>Call leads</h2>
    <div class="card" id="calls"></div>
  </section>

  <section class="stuck-sec">
    <h2>Stuck? Do one small thing</h2>
    <div class="card stuck"><button class="btn" id="pickbtn" type="button">Pick one for me</button><span class="pick" id="pick">Just one 10-minute thing. You can stop after.</span></div>
  </section>

  <h2>Lanes</h2>
  <div class="grid" id="lanes"></div>

  <h2>This week</h2>
  <div class="week" id="week"></div>

  <h2>Inbox from Elodie</h2>
  <div class="card" id="elodie"></div>

  <footer id="foot"></footer>
</div>
<script>
(() => {
  const API = "https://amy-dashboard-ticks.sullivanamy75.workers.dev";
  const DONE_KEY = "amy-day-v2-done", OUT_KEY = "amy-day-v2-outbox";
  const QUOTES = [ { t: "How we spend our days is, of course, how we spend our lives.", by: "Annie Dillard" },{ t: "Start where you are. Use what you have. Do what you can.", by: "Arthur Ashe" },{ t: "You do not rise to the level of your goals. You fall to the level of your systems.", by: "James Clear" },{ t: "It always seems impossible until it's done.", by: "Nelson Mandela" },{ t: "The best way out is always through.", by: "Robert Frost" },{ t: "You can do anything, but not everything.", by: "David Allen" },{ t: "Focus on being productive instead of busy.", by: "Tim Ferriss" },{ t: "Action isn't just the effect of motivation; it's also the cause of it.", by: "Mark Manson" },{ t: "Nothing is so fatiguing as the eternal hanging on of an uncompleted task.", by: "William James" },{ t: "Just five minutes. You're allowed to quit after five minutes. (You won't.)", by: "the Frog" },{ t: "Well done is better than well said.", by: "Benjamin Franklin" },{ t: "Success is the sum of small efforts, repeated day in and day out.", by: "Robert Collier" },{ t: "Finish each day and be done with it. You have done what you could.", by: "Ralph Waldo Emerson" },{ t: "Tomorrow is always fresh, with no mistakes in it.", by: "L. M. Montgomery" },{ t: "Don't count the days; make the days count.", by: "Muhammad Ali" },{ t: "Momentum or it dies. Small daily touches count.", by: "house rule" },{ t: "Receipts beat vibes.", by: "house motto" } ];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const device = /iPhone|iPad/.test(navigator.userAgent) ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android" : /Mac/.test(navigator.userAgent) ? "Mac" : "browser";

  let data = null;
  let done = load(DONE_KEY, {});
  let outbox = load(OUT_KEY, []);
  const labels = {};

  function setSync(state, text) {
    document.getElementById("sdot").className = "dot " + (state || "");
    document.getElementById("stext").textContent = text;
  }

  // quotes
  let qi = Math.floor(Date.now() / 1200000) % QUOTES.length;
  function paintQuote() {
    const q = document.getElementById("quote"), it = QUOTES[qi % QUOTES.length];
    q.style.opacity = 0;
    setTimeout(() => { q.innerHTML = esc(it.t) + "<cite>" + esc(it.by) + "</cite>"; q.style.opacity = 1; }, 200);
  }
  document.getElementById("quote-next").onclick = () => { qi++; paintQuote(); };
  setInterval(() => { qi++; paintQuote(); }, 1200000);
  paintQuote();

  const taskHtml = (t, lane) => {
    labels[t.id] = { label: t.text, lane };
    return '<button type="button" class="task' + (done[t.id] ? " done" : "") + '" data-id="' + esc(t.id) + '">' +
      '<span class="box"></span><span><span class="label">' + esc(t.text) + '</span>' +
      (t.note ? '<span class="note">' + esc(t.note) + '</span>' : "") + '</span></button>';
  };

  function render() {
    if (!data) return;
    document.getElementById("kicker").textContent = data.kicker || "";
    document.getElementById("heading").textContent = data.heading || "Amy — today";
    document.getElementById("msg").textContent = data.message || "";
    const f = data.frog;
    document.getElementById("frog").innerHTML = f ? '<div class="kicker">🐸 Today\'s frog · eat it first</div>' + taskHtml(f, "frog") : "";
    document.getElementById("frog").style.display = f ? "" : "none";
    document.getElementById("today").innerHTML = (data.today || []).map((t) => taskHtml(t, "today")).join("");
    renderCalls();
    document.getElementById("lanes").innerHTML = (data.lanes || []).map((l) => {
      const n = l.tasks.length, d = l.tasks.filter((t) => done[t.id]).length;
      return '<div class="card"><div class="lane-h"><b>' + esc(l.emoji + " " + l.name) + '</b>' +
        (l.tag ? '<span class="tag">' + esc(l.tag) + '</span>' : "") +
        (n ? '<span class="count">' + d + " of " + n + " done</span>" : "") + '</div>' +
        l.tasks.map((t) => taskHtml(t, l.id)).join("") +
        (((l.waiting || []).length + (l.facts || []).length) ? '<ul class="facts">' +
          (l.waiting || []).map((w) => '<li class="wait">' + esc(w) + "</li>").join("") +
          (l.facts || []).map((w) => "<li>" + esc(w) + "</li>").join("") + "</ul>" : "") + "</div>";
    }).join("");
    document.getElementById("week").innerHTML = (data.week || []).map((d) =>
      '<div class="day' + (d.today ? " today" : "") + '"><span class="d">' + esc(d.day) + '</span><span class="dt">' + esc(d.date) + "</span>" +
      "<ul>" + d.items.map((i) => "<li>" + esc(i) + "</li>").join("") + "</ul>" +
      (d.trash ? '<div class="trash">🗑️ trash night, after 5</div>' : "") + "</div>").join("");
    const el = data.elodie || [];
    document.getElementById("elodie").innerHTML = el.length ? el.map((t) => taskHtml(t, "elodie")).join("")
      : '<div class="empty">Nothing from Elodie yet. When she emails her task list, Riley adds the tasks here and you can tick them like the rest.</div>';
    document.getElementById("foot").textContent = "Updated " + new Date(data.updated).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) + " · ticks save on this device and sync to Riley";
  }


  // ── Call leads (encrypted calls.enc.json: calls + callScripts). Outcomes reuse the tick sync: id "call:<callId>:<outcome>".
  // Calls are NOT in data.json; they come encrypted from calls.enc.json (see loadCalls).
  // Notes ride the same /tick endpoint: id "call:<callId>:note", label = note text (≤200 chars, worker clips).
  const NOTES_KEY = "amy-day-v2-callnotes";
  let notes = load(NOTES_KEY, {});
  const NOTES_AT_KEY = "amy-day-v2-callnotes-at";
  let notesAt = load(NOTES_AT_KEY, {});
  const noteBusy = {}, noteFlash = {}, noteErr = {};
  const hhmm = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
  function noteStatus(cid) {
    const nk = "call:" + cid + ":note";
    if (noteErr[cid]) return { cls: "err", text: noteErr[cid] };
    if (noteBusy[cid]) return { cls: "", text: "Saving…" };
    if (notes[cid]) { const t = hhmm(notesAt[cid] || done[nk]); return { cls: "ok", text: "✓ Saved" + (t ? " " + t : "") + ": “" + notes[cid] + "”" }; }
    if (done[nk]) { const t = hhmm(done[nk]); return { cls: "", text: "A note was saved on another device" + (t ? " at " + t : "") + " (Riley has it)" }; }
    return { cls: "", text: "" };
  }
  const OUTCOMES = [["answered","Answered"],["voicemail","Voicemail"],["gatekeeper","Gatekeeper"],["no_answer","No answer"],["interested","Interested"],["not_interested","Not interested"],["call_back","Call back"]];
  const telHref = (p) => "tel:" + String(p || "").replace(/[^\d+]/g, "");
  const callDone = (c) => OUTCOMES.some(([k]) => done["call:" + c.id + ":" + k]);
  function md(text) {
    const inl = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    let out = "", list = false;
    for (const raw of String(text || "").split("\n")) {
      const ln = raw.trimEnd();
      const isLi = /^[-•] /.test(ln);
      if (list && !isLi) { out += "</ul>"; list = false; }
      if (!ln.trim()) continue;
      if (/^#{1,4} /.test(ln)) out += "<h4>" + inl(ln.replace(/^#+ /, "")) + "</h4>";
      else if (isLi) { if (!list) { out += "<ul>"; list = true; } out += "<li>" + inl(ln.slice(2)) + "</li>"; }
      else out += "<p>" + inl(ln) + "</p>";
    }
    return out + (list ? "</ul>" : "");
  }
  function callHtml(c) {
    const urgent = c.chapter === "Ch 7", isDone = callDone(c);
    const who = [c.name, c.company].filter(Boolean).join(" · ");
    const big = c.direct_phone || c.phone, small = c.direct_phone && c.phone && c.phone !== c.direct_phone ? c.phone : "";
    const nk = "call:" + c.id + ":note";
    const localNote = notes[c.id] || "";
    const nst = noteStatus(c.id);
    const tr = c.trustee && c.trustee.status === "verified" ? c.trustee : null, trNF = c.trustee && c.trustee.status === "not_found";
    const co = c.counsel || null;
    const whoHtml = tr ? '<div class="who wt"><div class="wlab"><span class="k">1 · Call first</span>Trustee: <b>' + esc(tr.name) + '</b></div>' +
        (tr.phone ? '<a class="tel" data-who="trustee" href="' + esc(telHref(tr.phone)) + '">📞 Trustee: ' + esc(tr.name) + ' · ' + esc(tr.phone) + '</a>' : '<span class="cline">No trustee phone on file</span>') +
        (tr.email ? '<div class="cmail">✉ ' + esc(tr.email) + '</div>' : "") + '</div>' +
      (co ? '<div class="who wc"><div class="wlab"><span class="k">2 · Then</span>Counsel: <b>' + esc(co.name) + '</b>' + (co.role ? ' <span class="crole">' + esc(co.role) + '</span>' : "") + '</div>' +
        (co.phone ? '<a class="tel c2" data-who="counsel" href="' + esc(telHref(co.phone)) + '">📞 Counsel · ' + esc(co.phone) + '</a>' : "") +
        (co.email ? '<div class="cmail">✉ ' + esc(co.email) + '</div>' : "") + '</div>' : "") : "";
    return '<div class="call' + (urgent ? " urgent" : "") + (isDone ? " done" : "") + (c.id === spCall ? " active" : "") + '" data-call="' + esc(c.id) + '">' +
      '<div class="call-h">' + (c.time ? '<span class="ctime">' + esc(c.time) + '</span>' : "") +
        '<span class="cname">' + esc(c.name || c.company || "") + '</span>' + (c.role ? '<span class="crole">' + esc(c.role) + '</span>' : "") + '</div>' +
      (c.company && c.name ? '<div class="ccomp">' + esc(c.company) + '</div>' : "") +
      '<div class="badges">' + (urgent ? '<span class="badge urg">URGENT</span>' : "") +
        (c.chapter ? '<span class="badge ch">' + esc(c.chapter) + '</span>' : "") +
        (c.script_tag ? '<span class="badge">' + esc(c.script_tag) + '</span>' : "") +
        (c.attempt ? '<span class="badge">' + esc(c.attempt) + '</span>' : "") +
        (tr ? '<span class="badge urg">CALL TRUSTEE FIRST</span>' : trNF ? '<span class="badge tnf">trustee: not found</span>' : "") +
        (isDone ? '<span class="badge ok">✓ Called</span>' : "") + '</div>' +
      (tr ? whoHtml : '<div class="phones">' + (big ? '<a class="tel" href="' + esc(telHref(big)) + '">📞 ' + esc(big) + (c.direct_phone ? " · direct" : "") + '</a>' : '<span class="cline">No phone on file</span>') +
        (small ? '<a class="tel sm" href="' + esc(telHref(small)) + '">main office ' + esc(small) + '</a>' : "") + '</div>' +
      (c.email ? '<div class="cmail">✉ ' + esc(c.email) + '</div>' : "")) +
      (c.why ? '<div class="cline"><b>Why:</b> ' + esc(c.why) + '</div>' : "") +
      '<div class="cline crec"><b>Records to mention:</b> ' + esc(recMention(c)) + '</div>' +
      (c.records ? '<details><summary>Records they could sell</summary>' + esc(c.records) + '</details>' : "") +
      '<div class="outs">' + OUTCOMES.map(([k, l]) => '<button type="button" class="out' + (done["call:" + c.id + ":" + k] ? " on" : "") + '" data-call="' + esc(c.id) + '" data-out="' + k + '">' + l + '</button>').join("") + '</div>' +
      '<div class="cnote"><textarea maxlength="200" rows="1" placeholder="Quick note (who answered, call back when…)" data-note="' + esc(c.id) + '">' + esc(localNote) + '</textarea><button type="button" data-savenote="' + esc(c.id) + '"' + (noteBusy[c.id] ? " disabled" : "") + (noteFlash[c.id] > Date.now() ? ' class="saved"' : "") + '>' + (noteBusy[c.id] ? "Saving…" : noteFlash[c.id] > Date.now() ? "Saved ✓" : "Save") + '</button></div>' +
      '<div class="nstat' + (nst.cls ? " " + nst.cls : "") + '" id="nstat-' + esc(c.id) + '">' + esc(nst.text) + '</div>' +
      '</div>';
  }
  // Encrypted payload: ./calls.enc.json = AES-GCM(PBKDF2-SHA256(passcode)) of {calls, callScripts, updated}.
  const PASS_KEY = "amy-day-v2-callpass", ENC_KEY = "amy-day-v2-callsenc";
  let secret = null, lockState = "loading", lockErr = "";
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function decryptCalls(enc, pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(enc.iv) }, key, unb64(enc.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  let lastCt = null;
  async function loadCalls(passTry) {
    let enc = null;
    try { const r = await fetch("./calls.enc.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) { enc = await r.json(); save(ENC_KEY, enc); } } catch {}
    if (!enc) enc = load(ENC_KEY, null);
    if (!enc || !enc.ct) { secret = null; lockState = "none"; renderCalls(); return; }
    const pass = passTry ?? localStorage.getItem(PASS_KEY);
    if (!pass) { lockState = "locked"; lockErr = ""; renderCalls(); return; }
    if (!passTry && secret && lastCt === enc.ct) return; // unchanged, already unlocked
    try {
      secret = await decryptCalls(enc, pass); lastCt = enc.ct;
      localStorage.setItem(PASS_KEY, pass); lockState = "ok"; lockErr = "";
    } catch {
      secret = null; lockState = "locked";
      lockErr = passTry ? "That passcode didn't work. Check the spelling and try again (dashes included)." : "The saved passcode no longer works. Please enter the new one.";
      if (!passTry) localStorage.removeItem(PASS_KEY);
    }
    renderCalls();
  }
  // ── Script side panel. Tabs are built from callScripts (voicemail split into attorney/owner by paragraph prefix).
  const SP_TAB_KEY = "amy-day-v2-sptab";
  let spTab = localStorage.getItem(SP_TAB_KEY) || "atty_live", spCall = null, spCollapsed = true, spWho = "";
  function scriptTabs(cs) {
    const T = (k) => (cs[k] && (cs[k].text ?? cs[k].body)) || "";
    const vm = String(T("voicemail")).split(/\n\s*\n/).map((x) => x.trim()).filter(Boolean);
    const pick = (re) => vm.filter((x) => re.test(x)).join("\n\n");
    const vmA = pick(/^\*\*Attorney/i), vmO = pick(/^\*\*Owner/i), vmL = pick(/^\*\*LINK/i);
    const vmT = (cs.voicemail && cs.voicemail.title) || "Voicemail";
    const tabs = [
      ["atty_live", "Attorney/Trustee · live", (cs.live_attorney && cs.live_attorney.title) || "Live call: Attorney / Trustee", T("live_attorney")],
      ["atty_vm", "Attorney/Trustee · voicemail", vmT, vmA || T("voicemail")],
      ["owner_live", "Owner · live", (cs.live_owner && cs.live_owner.title) || "Live call: Owner", T("live_owner")],
      ["owner_vm", "Owner · voicemail", vmT, vmO || T("voicemail")],
      ["link", "Link-only", (cs.link_only && cs.link_only.title) || "Link-only", T("link_only") + (vmL ? "\n\n## Voicemail (link email sent)\n" + vmL : "")],
      ["questions", "Likely questions", (cs.questions && cs.questions.title) || "Likely questions", T("questions")],
      ["gatekeeper", "Gatekeeper tips", (cs.gatekeeper && cs.gatekeeper.title) || "Gatekeeper tips", T("gatekeeper")],
      ["bankruptcy", "Bankruptcy cheat sheet", (cs.bankruptcy && cs.bankruptcy.title) || "Bankruptcy cheat sheet", T("bankruptcy")],
    ];
    const known = ["voicemail", "live_attorney", "live_owner", "link_only", "questions", "gatekeeper", "bankruptcy"];
    for (const [k, b] of Object.entries(cs)) if (!known.includes(k)) tabs.push([k, (b && b.title) || k, (b && b.title) || k, T(k)]);
    return tabs.filter((t) => String(t[3]).trim());
  }
  const leadKind = (c) => {
    const tag = String(c.script_tag || "").toUpperCase();
    if (/LINK/.test(tag)) return "link";
    if (/^OWNER/.test(tag)) return "owner";
    if (/ATTORNEY|TRUSTEE/.test(tag) || c.chapter || /trustee|counsel|attorney/i.test(c.role || "")) return "atty";
    return "owner";
  };
  const firstName = (n) => {
    const parts = String(n || "").replace(/\(.*?\)/g, " ").split(",")[0].trim().split(/\s+/).filter(Boolean);
    const skip = /^(mr|mrs|ms|dr|hon|the)\.?$/i;
    return parts.find((w) => !skip.test(w) && !/^[A-Z]\.$/.test(w)) || parts[0] || "";
  };
  const REC_FALLBACK = "old support tickets, documents and code";
  const recMention = (c) => String((c && c.records_mention) || "").trim() || REC_FALLBACK;
  const shortCo = (co) => String(co || "").split(/\s\+\s|\s\(/)[0].trim();
  function fillScript(html, c) {
    if (!c) return html;
    const tr = c.trustee && c.trustee.status === "verified" ? c.trustee : null;
    const person = spWho === "trustee" && tr ? tr.name : spWho === "counsel" && c.counsel ? c.counsel.name : c.name;
    const rep = { "[Name]": firstName(person), "[Company]": shortCo(c.company), "[Records]": recMention(c), "[email]": c.email || "" };
    for (const [ph, v] of Object.entries(rep)) if (v) html = html.split(esc(ph)).join("<mark>" + esc(v) + "</mark>");
    return html;
  }
  function panelHtml(sd, calls) {
    const cs = sd.callScripts && typeof sd.callScripts === "object" ? sd.callScripts : {};
    const tabs = scriptTabs(cs);
    if (!tabs.length) return "";
    if (!tabs.some((t) => t[0] === spTab)) spTab = tabs[0][0];
    const t = tabs.find((x) => x[0] === spTab);
    const c = spCall ? calls.find((x) => x.id === spCall) : null;
    return '<aside class="spanel' + (spCollapsed ? " collapsed" : "") + '" id="spanel"><div class="sp-h"><b>📜 Call script</b>' +
      '<button type="button" class="sp-toggle" id="sptoggle">' + (spCollapsed ? "Show script ▾" : "Hide script ▴") + '</button></div>' +
      '<div class="sp-body"><div class="stabs">' + tabs.map(([k, l]) => '<button type="button" class="stab' + (k === spTab ? " on" : "") + '" data-stab="' + esc(k) + '">' + esc(l) + '</button>').join("") + '</div>' +
      (c ? '<div class="sp-for">For: <b>' + esc(spWhoLabel(c)) + '</b>' + (c.company && c.name ? " · " + esc(shortCo(c.company)) : "") + ' <button type="button" id="spclear">clear</button></div>'
         : (calls.length ? '<div class="sp-for">Tap a lead to switch to its script and fill in the name, company and records.</div>' : "")) +
      '<div class="sp-title">' + esc(t[2]) + '</div><div class="stext">' + fillScript(md(t[3]), c) + '</div></div></aside>';
  }
  function spWhoLabel(c) {
    const tr = c.trustee && c.trustee.status === "verified" ? c.trustee : null;
    if (spWho === "trustee" && tr) return "Trustee: " + tr.name;
    if (spWho === "counsel" && c.counsel) return "Counsel: " + c.counsel.name;
    return c.name || c.company || "";
  }
  function setTab(k) { spTab = k; try { localStorage.setItem(SP_TAB_KEY, k); } catch {} }
  document.addEventListener("click", (e) => {
    const tb = e.target.closest("[data-stab]");
    if (tb) { setTab(tb.dataset.stab); renderCalls(); const sp = document.getElementById("spanel"); if (sp) sp.scrollTop = 0; return; }
    if (e.target.id === "sptoggle") { spCollapsed = !spCollapsed; renderCalls(); return; }
    if (e.target.id === "spclear") { spCall = null; renderCalls(); return; }
    if (e.target.closest("textarea,input,[data-savenote]")) return; // don't re-render while typing a note
    const card = e.target.closest(".call[data-call]");
    if (!card) return;
    const whoEl = e.target.closest("[data-who]"), c = ((secret && secret.calls) || []).find((x) => x && x.id === card.dataset.call); if (!c) return;
    const tr0 = c.trustee && c.trustee.status === "verified";
    const newWho = whoEl ? whoEl.dataset.who : (card.dataset.call === spCall ? spWho : (tr0 ? "trustee" : ""));
    if (card.dataset.call === spCall && newWho === spWho) return;
    spWho = newWho;
    if (card.dataset.call === spCall) { renderCalls(); return; }
    spCall = c.id;
    const kind = leadKind(c), vmMode = /_vm$/.test(spTab);
    setTab(kind === "link" ? "link" : kind + (vmMode ? "_vm" : "_live"));
    renderCalls();
    const sp = document.getElementById("spanel"); if (sp) sp.scrollTop = 0;
  });
  function renderCalls() {
    const box = document.getElementById("calls");
    if (!box || !data) return;
    if (lockState === "loading") { box.innerHTML = '<div class="empty">Loading calls…</div>'; return; }
    if (lockState === "locked") {
      document.getElementById("calls-sec").classList.remove("split");
      box.innerHTML = '<form class="unlock" id="unlock"><div class="cline">🔒 Your call list is private. Enter your passcode once on this device.</div>' +
        '<div class="cnote"><input id="callpass" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="Passcode" />' +
        '<button type="submit">Unlock</button></div><div class="nstat err">' + esc(lockErr) + '</div></form>';
      return;
    }
    const sd = secret || {};
    const calls = Array.isArray(sd.calls) ? sd.calls.filter((c) => c && c.id) : [];
    calls.forEach((c) => { labels["call:" + c.id] = { label: [c.name, c.company].filter(Boolean).join(" · "), lane: "calls" }; });
    const spOld = document.getElementById("spanel"), spScroll = spOld ? spOld.scrollTop : 0;
    let h = "";
    if (!calls.length) h += '<div class="empty">No calls today. 🎉 When there\'s a call list, Riley puts it here at 7am.</div>';
    else {
      const n = calls.length, d = calls.filter(callDone).length;
      h += '<div class="calls-top"><span class="calls-prog"><b>' + d + " of " + n + "</b> called</span>" +
        (calls.some((c) => c.chapter === "Ch 7") ? '<span class="tag">CHAPTER 7 FIRST</span>' : "") + '</div>' +
        '<div class="pbar"><i style="width:' + Math.round((d / n) * 100) + '%"></i></div>';
      const order = [], groups = {};
      for (const c of calls) { const s = c.section || "Calls"; if (!groups[s]) { groups[s] = []; order.push(s); } groups[s].push(c); }
      for (const s of order) h += '<div class="csec">' + esc(s) + "</div>" + groups[s].map(callHtml).join("");
    }
    if (lockState === "ok") h += '<button type="button" class="linkbtn" id="calllock">🔒 Lock call list on this device</button>';
    const panel = panelHtml(sd, calls);
    document.getElementById("calls-sec").classList.toggle("split", !!panel);
    box.innerHTML = panel ? '<div class="csplit"><div class="clist">' + h + "</div>" + panel + "</div>" : h;
    const spNew = document.getElementById("spanel"); if (spNew && spScroll) spNew.scrollTop = spScroll;
  }
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "unlock") return;
    e.preventDefault();
    const v = document.getElementById("callpass").value.trim();
    if (!v) return;
    lockErr = ""; const st = e.target.querySelector(".nstat"); if (st) st.textContent = "Unlocking…";
    loadCalls(v);
  });
  document.addEventListener("click", (e) => {
    if (e.target.id !== "calllock") return;
    localStorage.removeItem(PASS_KEY); secret = null; lastCt = null; lockState = "locked"; lockErr = ""; renderCalls();
  });
  function pushTick(id, label, now) {
    outbox.push({ id, label, lane: "calls", done: now, device });
    save(OUT_KEY, outbox); flush();
  }
  function paintNote(cid) {
    const st = document.getElementById("nstat-" + cid), btn = document.querySelector('[data-savenote="' + CSS.escape(cid) + '"]');
    const ns = noteStatus(cid);
    if (st) { st.className = "nstat" + (ns.cls ? " " + ns.cls : ""); st.textContent = ns.text; }
    if (btn) { const fl = noteFlash[cid] > Date.now(); btn.disabled = !!noteBusy[cid]; btn.className = fl ? "saved" : ""; btn.textContent = noteBusy[cid] ? "Saving…" : fl ? "Saved ✓" : "Save"; }
  }
  async function saveNote(cid, viaBlur) {
    if (noteBusy[cid]) return;
    const ta = document.querySelector('textarea[data-note="' + CSS.escape(cid) + '"]'); if (!ta) return;
    const text = ta.value.trim().slice(0, 200);
    const id = "call:" + cid + ":note";
    const pending = outbox.some((o) => o.id === id);
    if ((notes[cid] || "") === text) {           // same text as last save: don't post it again
      if (pending) { noteBusy[cid] = true; paintNote(cid); const ok = await flush(); noteBusy[cid] = false; noteErr[cid] = ok ? "" : noteErr[cid]; if (ok) noteFlash[cid] = Date.now() + 3000; paintNote(cid); setTimeout(() => paintNote(cid), 3100); }
      else if (!viaBlur && text) { noteFlash[cid] = Date.now() + 3000; paintNote(cid); setTimeout(() => paintNote(cid), 3100); }
      return;
    }
    const now = new Date().toISOString();
    if (text) { notes[cid] = text; notesAt[cid] = now; done[id] = now; } else { delete notes[cid]; delete notesAt[cid]; delete done[id]; }
    save(NOTES_KEY, notes); save(NOTES_AT_KEY, notesAt); save(DONE_KEY, done);
    outbox = outbox.filter((o) => o.id !== id);   // only the latest note text for this lead is queued
    outbox.push({ id, label: text, lane: "calls", done: !!text, device }); save(OUT_KEY, outbox);
    noteBusy[cid] = true; noteErr[cid] = ""; paintNote(cid);
    const ok = await flush();
    noteBusy[cid] = false;
    if (ok) { noteFlash[cid] = Date.now() + 3000; noteErr[cid] = ""; setTimeout(() => paintNote(cid), 3100); }
    else noteErr[cid] = "⚠️ Couldn't reach Riley. The note is kept on this device and will retry; tap Save to try again now.";
    paintNote(cid);
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".out");
    if (b) {
      const cid = b.dataset.call, id = "call:" + cid + ":" + b.dataset.out, now = !done[id];
      if (now) done[id] = new Date().toISOString(); else delete done[id];
      save(DONE_KEY, done);
      const meta = labels["call:" + cid] || {};
      pushTick(id, b.textContent + " · " + (meta.label || cid), now);
      renderCalls(); return;
    }
    const sv = e.target.closest("[data-savenote]");
    if (sv) saveNote(sv.dataset.savenote);
  });
  document.addEventListener("change", (e) => { if (e.target.matches && e.target.matches("textarea[data-note]")) saveNote(e.target.dataset.note, true); });

  document.addEventListener("click", (e) => {
    const b = e.target.closest(".task"); if (!b) return;
    const id = b.dataset.id, now = !done[id];
    if (now) done[id] = new Date().toISOString(); else delete done[id];
    save(DONE_KEY, done);
    const meta = labels[id] || {};
    outbox.push({ id, label: meta.label || id, lane: meta.lane || "", done: now, device });
    save(OUT_KEY, outbox);
    render(); flush();
  });

  let flushP = null;
  function flush() {   // resolves true once the outbox is empty (everything reached the worker)
    if (flushP) return flushP;
    flushP = (async () => {
      try {
        while (outbox.length) {
          const r = await fetch(API + "/tick", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(outbox[0]) });
          if (!r.ok) throw new Error("tick " + r.status);
          outbox.shift(); save(OUT_KEY, outbox);
        }
        setSync("ok", "Saved · Riley can see it"); return true;
      } catch {
        setSync("wait", "Saved on this device · will sync when online"); return false;
      } finally { flushP = null; }
    })();
    return flushP;
  }

  async function pullState() {
    if (outbox.length) return flush();
    try {
      const r = await fetch(API + "/state", { cache: "no-store" });
      const j = await r.json();
      if (j && j.done && !outbox.length) { done = j.done; save(DONE_KEY, done); render(); }
      setSync("ok", "Saved · Riley can see it");
    } catch { setSync("wait", "Saved on this device · will sync when online"); }
  }

  document.getElementById("pickbtn").onclick = () => {
    const q = (data && data.quick) || [];
    if (!q.length) return;
    document.getElementById("pick").textContent = "Your 10-minute win: " + q[Math.floor(Math.random() * q.length)];
    document.getElementById("pickbtn").textContent = "Pick another";
  };

  async function boot() {
    try {
      const r = await fetch("./data.json?t=" + Date.now(), { cache: "no-store" });
      data = await r.json(); save("amy-day-v2-data", data);
    } catch { data = load("amy-day-v2-data", null); }
    render(); pullState(); loadCalls();
  }
  boot();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { boot(); } });
  window.addEventListener("online", flush);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
})();
</script>
