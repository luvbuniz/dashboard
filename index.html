<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🚀 Amy's Command Center</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1c1c1e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Local, gitignored config. A 404 here is fine — the app runs without it.
         Relative path so it also resolves when hosted under a subpath (GitHub Pages). -->
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="title-block">
          <h1>🚀 Amy's Command Center</h1>
          <div class="topbar-sub">
            <span id="hermes-dot" class="hermes-dot" title="Hermes webhook status">⚪</span>
            <span id="today-date"></span>
            <button id="theme-toggle" class="theme-btn" data-action="theme-toggle"
              title="Toggle dark mode">🌙</button>
          </div>
        </div>
        <div id="live-clock" class="live-clock">--:--</div>
      </header>

      <section id="quote"></section>
      <section id="frog-banner"></section>
      <section id="agenda"></section>
      <section id="summary"></section>
      <section id="timelog"></section>
      <section id="widgets" class="widgets"></section>
      <main id="tracks"></main>
      <section id="history"></section>

      <footer class="footer">
        <span>💛 One task at a time. Receipts beat vibes.</span>
        <div id="build-stamp" class="build-stamp"></div>
      </footer>
    </div>
    <canvas id="confetti-canvas"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
