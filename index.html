  <style>

    .cdur { font-weight:600; margin-left:6px; }
    .tel.sm { background:none; color:var(--copper); font-size:14px; font-weight:500; padding:6px 0; min-height:0; text-decoration:underline; }
    .cmail { font-size:13px; color:var(--muted); word-break:break-all; }

    .cnote { display:flex; gap:6px; margin-top:8px; }

<script type="module">

  const QUOTES = [ { t: "How we spend our days is, of course, how we spend our lives.", by: "Annie Dillard" },{ t: "Start where you are. Use what you have. Do what you can.", by: "Arthur Ashe" },{ t: "You do not rise to the level of your goals. You fall to the level of your systems.", by: "James Clear" },{ t: "It always seems impossible until it's done.", by: "Nelson Mandela" },{ t: "The best way out is always through.", by: "Robert Frost" },{ t: "You can do anything, but not everything.", by: "David Allen" },{ t: "Focus on being productive instead of busy.", by: "Tim Ferriss" },{ t: "Action isn't just the effect of motivation; it's also the cause of it.", by: "Mark Manson" },{ t: "Nothing is so fatiguing as the eternal hanging on of an uncompleted task.", by: "William James" },{ t: "Just five minutes. You're allowed to quit after five minutes. (You won't.)", by: "the Frog" },{ t: "Well done is better than well said.", by: "Benjamin Franklin" },{ t: "Success is the sum of small efforts, repeated day in and day out.", by: "Robert Collier" },{ t: "Finish each day and be done with it. You have done what you could.", by: "Ralph Waldo Emerson" },{ t: "Tomorrow is always fresh, with no mistakes in it.", by: "L. M. Montgomery" },{ t: "Don't count the days; make the days count.", by: "Muhammad Ali" },{ t: "Momentum or it dies. Small daily touches count.", by: "house rule" },{ t: "Receipts beat vibes.", by: "house motto" } ];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };

    const el = data.elodie || [];
    document.getElementById("elodie").innerHTML = el.length ? el.map((t) => taskHtml(t, "elodie")).join("")
      : '<div class="empty">Nothing from Elodie yet. When she emails her task list, Riley adds the tasks here and you can tick them like the rest.</div>';
    document.getElementById("foot").textContent = "Updated " + new Date(data.updated).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) + " · ticks save on this device and sync to Riley";
  }


  // ── Call leads (encrypted calls.enc.json: calls + callScripts). Outcomes reuse the tick sync: id "call:<callId>:<outcome>".
  // Calls are NOT in data.json; they come encrypted from calls.enc.json (see loadCalls).
  // Notes ride the same /tick endpoint: id "call:<callId>:note", label = note text (≤200 chars, worker clips).
  const NOTES_KEY = "amy-day-v2-callnotes";
  let notes = load(NOTES_KEY, {});
  const NOTES_AT_KEY = "amy-day-v2-callnotes-at";
  let notesAt = load(NOTES_AT_KEY, {});
  const noteBusy = {}, noteFlash = {}, noteErr = {};
  const hhmm = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
  function noteStatus(cid) {
    const nk = "call:" + cid + ":note";
    if (noteErr[cid]) return { cls: "err", text: noteErr[cid] };
    if (noteBusy[cid]) return { cls: "", text: "Saving…" };
    if (notes[cid]) { const t = hhmm(notesAt[cid] || done[nk]); return { cls: "ok", text: "✓ Saved" + (t ? " " + t : "") + ": “" + notes[cid] + "”" }; }
    if (done[nk]) { const t = hhmm(done[nk]); return { cls: "", text: "A note was saved on another device" + (t ? " at " + t : "") + " (Riley has it)" }; }
    return { cls: "", text: "" };
  }
  const OUTCOMES = [["answered","Answered"],["voicemail","Voicemail"],["gatekeeper","Gatekeeper"],["no_answer","No answer"],["interested","Interested"],["not_interested","Not interested"],["call_back","Call back"]];
  const telHref = (p) => {   // E.164-ish (+1 for 10-digit US numbers); extension -> ",ext" (pause then digits)
    const m = String(p || "").match(/^(.*?)(?:\s*(?:ext\.?|x|#|extension)\s*(\d+))?\s*$/i);
    let d = (m[1] || "").replace(/[^\d+]/g, "");
    if (!d.startsWith("+")) d = d.length === 10 ? "+1" + d : d.length === 11 && d[0] === "1" ? "+" + d : d;
    return "tel:" + d + (m[2] ? "," + m[2] : "");
  };
  // Dial timing (10/29): tap Call -> call:<id>:dialed; next outcome -> call:<id>:dur:<sec|unknown> (only one dur tick on at a time).
  const durOf = (cid) => { const k = Object.keys(done).find((x) => x.startsWith("call:" + cid + ":dur:")); return k ? { v: k.split(":").pop(), at: done[k], k } : null; };
  const fmtDur = (s) => Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0");
  // Skip (10/30): id "call:<callId>:skip", label = reason text (≤200), done true = skipped, false = un-skipped.
  const SKIP_KEY = "amy-day-v2-callskip";
  let skips = load(SKIP_KEY, {});            // {cid: reason} for skips saved on this device
  const skipOpen = {}, skipBusy = {};
  // Email request (10/30): id "call:<callId>:email", label = "email|note" (≤200), done true = requested, false = cleared.
  const EML_KEY = "amy-day-v2-callemail";
  let emls = load(EML_KEY, {});              // {cid: "email|note"}
  const emlOpen = {};
  const isEml = (cid) => !!done["call:" + cid + ":email"];
  const emlLabel = (em, note) => { em = em.trim().slice(0, 200); note = note.trim().replace(/\s+/g, " "); return (em + "|" + note).slice(0, 200); };
  const isSkipped = (cid) => !!done["call:" + cid + ":skip"];
  const callDone = (c) => isSkipped(c.id) || OUTCOMES.some(([k]) => done["call:" + c.id + ":" + k]);
  const meetingsNow = () => (secret && Array.isArray(secret.meetings) ? secret.meetings : []);
  const isArchivedAttempt = (c) => attemptArchived(c, done, meetingsNow());
  // ---- court dates (341 / hearings / bar dates) ----
  const ETZ = "America/New_York";
  function kdEvents(c) {
    const k = c.kdates; if (!k || !Array.isArray(k.events)) return [];
    return k.events.map((e) => {
      const allDay = !e.iso, t = allDay ? Date.parse(e.date + "T23:59:00-05:00") : Date.parse(e.iso);

  function kdFmt(x) {

      // Keep split pane while searching: filter left list; right pane keeps selection or first match.

      const hotHits = hotLeadsList(sd).filter((hh) => stateMatchesFilter(hh) && (!qOn || callMatch(hotAsCall(hh) || { name: hh.contact, company: hh.company }, callQuery)))
        .map((hh) => hotMatchedCall(hh) || hotAsCall(hh)).filter(Boolean);
      const selectPool = [];
      const seenSel = new Set();
      for (const row of hotHits.concat(calls)) {
        if (!row || !row.id || seenSel.has(row.id)) continue;
        seenSel.add(row.id); selectPool.push(row);
      }
      ensureSpInFilter(selectPool);
      const matchN = calls.length + (qOn ? hotHits.filter((hc) => !calls.some((c) => c.id === hc.id)).length : 0);
      h = listSearchHtml() + (qOn ? '<div class="cline">Showing ' + matchN + ' match' + (matchN === 1 ? "" : "es") + ' for “' + esc(String(callQuery).trim()) + '”.</div>' : "") + h;
      const order = [], groups = {};
      for (const c of calls) { const s = c.section || "Calls"; if (!groups[s]) { groups[s] = []; order.push(s); } groups[s].push(c); }
      let ex = "", exN = 0;
      for (const s of order) {
        const g = groups[s], isCh7 = g.some((c) => c.chapter === "Ch 7" && c.kdates);
        if (/^Extra/.test(s)) {   // all "Extra …" sections go in one collapsed block, sub-headed by what follows "·"
          const sub = s.includes("·") ? s.split("·").slice(1).join("·").trim() : "";
          ex += (sub ? '<div class="csec">' + esc(sub) + "</div>" : "") + g.map(callHtml).join(""); exN += g.length; continue;
        }
        h += '<div class="csec">' + esc(s) + "</div>" + (isCh7 ? '<div class="cline ckd">Pinned first, then court dates in the next 7 days, then newest filings first (beat other brokers to the trustee). Called on an earlier day and already-called at the bottom.</div>' : "") + (isCh7 ? ch7Div(ch7Sort(g)) : g.map(callHtml).join(""));
      }
      if (exN) h += '<details id="extra-det"' + (extraOpen ? " open" : "") + '><summary class="csec">Extra – only if on a roll (' + exN + ")</summary>" + ex + "</details>";
      if (archivedCalls.length) h += '<details id="arch-det"' + (archiveBrowse ? " open" : "") + '><summary class="csec">Archived · 3 attempts (' + archivedCalls.length + ')</summary><div class="cline">Off the calling queue. Notes, meetings, and outcomes stay on the card. Search still finds them.</div>' + archivedCalls.map(callHtml).join("") + "</details>";
    }
    if (lockState === "ok") h += '<button type="button" class="linkbtn" id="calllock">🔒 Lock call list on this device</button>';
    const panel = panelHtml(sd, allCalls);
    document.getElementById("calls-sec").classList.toggle("split", !!panel);
    box.innerHTML = panel ? '<div class="csplit"><div class="clist">' + h + "</div>" + panel + "</div>" : h;
    const spNew = document.getElementById("spanel"); if (spNew && spScroll) spNew.scrollTop = spScroll;
    paintCallHits();
    if (qFocus) {
      const n = document.getElementById("callq");
      if (n) { n.focus(); if (qSel) try { n.setSelectionRange(qSel[0], qSel[1]); } catch {} }
    }
  }
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "unlock") return;
    e.preventDefault();
    const v = document.getElementById("callpass").value.trim();
    if (!v) return;
    lockErr = ""; const st = e.target.querySelector(".nstat"); if (st) st.textContent = "Unlocking…";
    loadCalls(v);
  });
  document.addEventListener("click", (e) => {
    if (e.target.id !== "calllock") return;
    localStorage.removeItem(PASS_KEY); secret = null; lastCt = null; lockState = "locked"; lockErr = ""; renderCalls();
  });
  function pushTick(id, label, now) {
    outbox.push({ id, label, lane: "calls", done: now, device });
    save(OUT_KEY, outbox); flush();
  }
  function paintNote(cid) {
    const st = document.getElementById("nstat-" + cid), btn = document.querySelector('[data-savenote="' + CSS.escape(cid) + '"]');
    const ns = noteStatus(cid);
    if (st) { st.className = "nstat" + (ns.cls ? " " + ns.cls : ""); st.textContent = ns.text; }
    if (btn) { const fl = noteFlash[cid] > Date.now(); btn.disabled = !!noteBusy[cid]; btn.className = fl ? "saved" : ""; btn.textContent = noteBusy[cid] ? "Saving…" : fl ? "Saved ✓" : "Save"; }
  }
  async function saveNote(cid, viaBlur) {
    if (noteBusy[cid]) return;
    const ta = document.querySelector('textarea[data-note="' + CSS.escape(cid) + '"]'); if (!ta) return;
    const text = ta.value.trim().slice(0, 200);
    const id = "call:" + cid + ":note";
    const pending = outbox.some((o) => o.id === id);
    if ((notes[cid] || "") === text) {           // same text as last save: don't post it again
      if (pending) { noteBusy[cid] = true; paintNote(cid); const ok = await flush(); noteBusy[cid] = false; noteErr[cid] = ok ? "" : noteErr[cid]; if (ok) noteFlash[cid] = Date.now() + 3000; paintNote(cid); setTimeout(() => paintNote(cid), 3100); }
      else if (!viaBlur && text) { noteFlash[cid] = Date.now() + 3000; paintNote(cid); setTimeout(() => paintNote(cid), 3100); }
      return;
    }
    const now = new Date().toISOString();
    if (text) { notes[cid] = text; notesAt[cid] = now; done[id] = now; } else { delete notes[cid]; delete notesAt[cid]; delete done[id]; }
    save(NOTES_KEY, notes); save(NOTES_AT_KEY, notesAt); save(DONE_KEY, done);
    outbox = outbox.filter((o) => o.id !== id);   // only the latest note text for this lead is queued
    outbox.push({ id, label: text, lane: "calls", done: !!text, device }); save(OUT_KEY, outbox);
    noteBusy[cid] = true; noteErr[cid] = ""; paintNote(cid);
    const ok = await flush();
    noteBusy[cid] = false;
    if (ok) { noteFlash[cid] = Date.now() + 3000; noteErr[cid] = ""; setTimeout(() => paintNote(cid), 3100); }
    else noteErr[cid] = "⚠️ Couldn't reach Riley. The note is kept on this device and will retry; tap Save to try again now.";
    paintNote(cid);
  }
  document.addEventListener("click", (e) => {
    if (e.target.id === "tidycalls") { frozenOn = false; frozen = {}; renderCalls(); return; }
    const b = e.target.closest(".out");
    if (b) {
      const cid = b.dataset.call, id = "call:" + cid + ":" + b.dataset.out, now = !done[id];
      if (Date.now() < outLock && cid !== outLockCid) return;   // debounce taps on other cards
      outLock = Date.now() + 600; outLockCid = cid;
      b.classList.toggle("on", now);   // instant green
      if (!frozenOn) { frozenOn = true; renderCalls(); }   // snapshot current order before ticking
      if (now) done[id] = new Date().toISOString(); else delete done[id];
      const dk = "call:" + cid + ":dialed", dAt = done[dk], od = durOf(cid);
      if (now && dAt && (!od || od.at < dAt)) {   // first outcome after this dial -> store duration
        const sec = Math.round((Date.now() - Date.parse(dAt)) / 1000), v = sec >= 0 && sec <= 1800 ? String(sec) : "unknown";
        if (od) { delete done[od.k]; pushTick(od.k, "dur", false); }
        const nk = "call:" + cid + ":dur:" + v; done[nk] = new Date().toISOString(); pushTick(nk, v, true);
      }
      save(DONE_KEY, done);
      const meta = labels["call:" + cid] || {};
      pushTick(id, b.textContent + " · " + (meta.label || cid), now);
      if (now) document.dispatchEvent(new CustomEvent("calloutcome", { detail: { cid } }));   // Pomodoro dial counter
      renderCalls(); return;
    }
    const sb = e.target.closest("[data-skip]");
    if (sb) { const cid = sb.dataset.skip; skipOpen[cid] = !skipOpen[cid]; sb.classList.toggle("open", !!skipOpen[cid]); renderCalls();
      const ta = document.querySelector('textarea[data-skipreason="' + CSS.escape(cid) + '"]'); if (ta) ta.focus(); return; }
    const eb = e.target.closest("[data-eml]");
    if (eb) { const cid = eb.dataset.eml; emlOpen[cid] = !emlOpen[cid]; renderCalls();
      const n = document.querySelector('input[data-emlnote="' + CSS.escape(cid) + '"]'); if (n) n.focus(); return; }
    const ec = e.target.closest("[data-emlclose]");
    if (ec) { delete emlOpen[ec.dataset.emlclose]; renderCalls(); return; }
    const es = e.target.closest("[data-emlsave]"), ex = e.target.closest("[data-emlclear]");
    if (es || ex) {
      const cid = (es || ex).dataset[es ? "emlsave" : "emlclear"], id = "call:" + cid + ":email";
      if (Date.now() < outLock && cid !== outLockCid) return;   // same 600ms debounce
      outLock = Date.now() + 600; outLockCid = cid;
      if (!frozenOn) { frozenOn = true; renderCalls(); }   // keep card order fixed
      outbox = outbox.filter((o) => o.id !== id);
      if (es) { const a = document.querySelector('input[data-emladdr="' + CSS.escape(cid) + '"]'), n = document.querySelector('input[data-emlnote="' + CSS.escape(cid) + '"]');
        const lab = emlLabel(a ? a.value : "", n ? n.value : ""); emls[cid] = lab; done[id] = new Date().toISOString();
        outbox.push({ id, label: lab, lane: "calls", done: true, device }); }
      else { delete emls[cid]; delete done[id]; outbox.push({ id, label: "", lane: "calls", done: false, device }); }
      delete emlOpen[cid]; save(EML_KEY, emls); save(DONE_KEY, done); save(OUT_KEY, outbox);
      renderCalls(); flush(); return;
    }
    const sc = e.target.closest("[data-skipclose]");
    if (sc) { delete skipOpen[sc.dataset.skipclose]; renderCalls(); return; }
    const ss = e.target.closest("[data-skipsave]"), us = e.target.closest("[data-unskip]");
    if (ss || us) {
      const cid = (ss || us).dataset[ss ? "skipsave" : "unskip"], id = "call:" + cid + ":skip";
      if (Date.now() < outLock && cid !== outLockCid) return;   // same 600ms debounce as outcomes
      outLock = Date.now() + 600; outLockCid = cid;
      if (!frozenOn) { frozenOn = true; renderCalls(); }   // keep card order fixed
      if (ss) { const ta = document.querySelector('textarea[data-skipreason="' + CSS.escape(cid) + '"]');
        const why = ta ? ta.value.trim().slice(0, 200) : ""; skips[cid] = why; done[id] = new Date().toISOString();
        outbox = outbox.filter((o) => o.id !== id); outbox.push({ id, label: why, lane: "calls", done: true, device }); }
      else { delete skips[cid]; delete done[id]; outbox = outbox.filter((o) => o.id !== id); outbox.push({ id, label: "", lane: "calls", done: false, device }); }
      delete skipOpen[cid]; save(SKIP_KEY, skips); save(DONE_KEY, done); save(OUT_KEY, outbox);
      renderCalls(); flush(); return;
    }
    const sv = e.target.closest("[data-savenote]");
    if (sv) saveNote(sv.dataset.savenote);
  });
  document.addEventListener("change", (e) => { if (e.target.matches && e.target.matches("textarea[data-note]")) saveNote(e.target.dataset.note, true); });

  document.addEventListener("click", (e) => {
    const b = e.target.closest(".task"); if (!b) return;
    const id = b.dataset.id, now = !done[id];
    if (now) done[id] = new Date().toISOString(); else delete done[id];
    save(DONE_KEY, done);
    const meta = labels[id] || {};
    outbox.push({ id, label: meta.label || id, lane: meta.lane || "", done: now, device });
    save(OUT_KEY, outbox);
    render(); flush();
  });

  let flushP = null;
  function flush() {   // resolves true once the outbox is empty (everything reached the worker)
    if (flushP) return flushP;
    flushP = (async () => {
      try {
        while (outbox.length) {
          const r = await fetch(API + "/tick", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(outbox[0]) });
          if (!r.ok) throw new Error("tick " + r.status);
          outbox.shift(); save(OUT_KEY, outbox);
        }
        setSync("ok", "Saved · Riley can see it"); return true;
      } catch {
        setSync("wait", "Saved on this device · will sync when online"); return false;
      } finally { flushP = null; }
    })();
    return flushP;
  }

  async function pullState() {
    if (outbox.length) return flush();
    try {
      const r = await fetch(API + "/state", { cache: "no-store" });
      const j = await r.json();
      if (j && j.done && !outbox.length) { done = j.done; save(DONE_KEY, done); render(); }
      setSync("ok", "Saved · Riley can see it");
    } catch { setSync("wait", "Saved on this device · will sync when online"); }
  }

  document.getElementById("pickbtn").onclick = () => {
    const q = (data && data.quick) || [];
    if (!q.length) return;
    document.getElementById("pick").textContent = "Your 10-minute win: " + q[Math.floor(Math.random() * q.length)];
    document.getElementById("pickbtn").textContent = "Pick another";
  };

  async function boot() {
    try {
      const r = await fetch("./data.json?t=" + Date.now(), { cache: "no-store" });
      data = await r.json(); save("amy-day-v2-data", data);
    } catch { data = load("amy-day-v2-data", null); }
    render(); pullState(); loadCalls();
  }
  boot();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { boot(); } });
  window.addEventListener("online", flush);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
})();
</script>
</body>
</html>
