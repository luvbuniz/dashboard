<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0b0a" />
  <title>Amy — today</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" href="./favicon.svg?v=8" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/crescent-180.png?v=8" />
  <link rel="manifest" href="./manifest.webmanifest?v=8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#0c0b0a; --panel:#151413; --elev:#1d1b19; --ink:#f3efe8; --muted:#a39c91; --faint:#756e64;
      --line:rgba(243,239,232,.09); --copper:#d0834f; --copper-dim:rgba(208,131,79,.16); --ok:#86ad72; --r:12px;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#faf7f2; --panel:#ffffff; --elev:#f3eee6; --ink:#24201c; --muted:#6c645a; --faint:#958c80;
        --line:rgba(36,32,28,.1); --copper:#b5652f; --copper-dim:rgba(181,101,47,.12); --ok:#4f8a3c; }
    }
    * { box-sizing:border-box; }
    html,body { margin:0; background:var(--bg); color:var(--ink); }
    body { font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%; }
    .wrap { max-width:1080px; margin:0 auto; padding:20px 16px calc(40px + env(safe-area-inset-bottom)); }
    header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:8px 16px; }
    .kicker { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:500; }
    h1 { font-family:Newsreader,Georgia,serif; font-weight:500; font-size:clamp(28px,5vw,38px); letter-spacing:-.02em; margin:2px 0 0; line-height:1.05; }
    .sync { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; }
    .dot.ok { background:var(--ok); } .dot.wait { background:var(--copper); }
    .msg { color:var(--muted); margin:10px 0 0; }
    .quote { font-family:Newsreader,Georgia,serif; font-size:19px; line-height:1.35; margin:20px 0 4px; max-width:34em; transition:opacity .4s; }
    .quote cite { display:block; font-family:"IBM Plex Sans",sans-serif; font-style:normal; font-size:12px; color:var(--faint); margin-top:4px; }
    .linkbtn { background:none; border:0; color:var(--faint); font:inherit; font-size:12px; padding:6px 0; cursor:pointer; }
    h2 { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:28px 0 10px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; }
    .frog { border-color:var(--copper); background:linear-gradient(0deg,var(--copper-dim),var(--copper-dim)),var(--panel); margin-top:18px; }
    .frog .kicker { color:var(--copper); }
    .task { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; background:none; border:0; color:inherit; font:inherit; padding:9px 0; cursor:pointer; -webkit-tap-highlight-color:transparent; min-height:44px; }
    .task + .task { border-top:1px solid var(--line); }
    .box { flex:none; width:24px; height:24px; border-radius:7px; border:2px solid var(--faint); margin-top:1px; display:grid; place-items:center; transition:all .15s; }
    .task.done .box { background:var(--ok); border-color:var(--ok); }
    .task.done .box::after { content:""; width:6px; height:11px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg) translate(-1px,-1px); }
    .task.done .label { text-decoration:line-through; color:var(--faint); }
    .label { display:block; }
    .note { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
    .lane-h { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px; margin-bottom:4px; }
    .lane-h b { font-weight:600; }
    .tag { font-size:10px; letter-spacing:.08em; font-weight:600; color:var(--copper); background:var(--copper-dim); padding:3px 7px; border-radius:99px; }
    .count { font-size:12px; color:var(--faint); }
    .facts { margin:8px 0 0; padding:0; list-style:none; font-size:14px; color:var(--muted); }
    .facts li { padding:5px 0; border-top:1px dashed var(--line); }
    .facts li.wait::before { content:"⏳ "; }
    .stuck { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
    .btn { background:var(--copper); color:#fff; border:0; border-radius:999px; font:inherit; font-weight:500; padding:10px 18px; min-height:44px; cursor:pointer; }
    .pick { flex:1 1 240px; }
    .week { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
    .day { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; }
    .day.today { border-color:var(--copper); }
    .day .d { font-weight:600; } .day .dt { color:var(--faint); font-size:12px; margin-left:4px; }
    .day ul { margin:6px 0 0; padding-left:16px; } .day .trash { color:var(--faint); font-size:12px; margin-top:6px; }
    .empty { color:var(--muted); font-size:14px; }
    footer { margin-top:32px; font-size:11px; color:var(--faint); }
    @media print {
      :root { --bg:#fff; --panel:#fff; --ink:#000; --muted:#333; --faint:#555; --line:#ccc; --copper:#000; --copper-dim:transparent; }
      .linkbtn,.stuck-sec,.sync,footer { display:none !important; }
      .wrap { padding:0; max-width:none; } .card,.day { break-inside:avoid; } .task { min-height:0; padding:5px 0; }
      .box { border-color:#000; } .grid { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="kicker" id="kicker"></div><h1 id="heading">Amy — today</h1></div>
    <div class="sync" title="Where your ticks are saved"><span class="dot" id="sdot"></span><span id="stext">Loading…</span></div>
  </header>
  <p class="msg" id="msg"></p>
  <blockquote class="quote" id="quote"></blockquote>
  <button class="linkbtn" id="quote-next" type="button">↻ another quote</button>

  <div class="card frog" id="frog"></div>

  <h2>Today's top 3</h2>
  <div class="card" id="today"></div>

  <section class="stuck-sec">
    <h2>Stuck? Do one small thing</h2>
    <div class="card stuck"><button class="btn" id="pickbtn" type="button">Pick one for me</button><span class="pick" id="pick">Just one 10-minute thing. You can stop after.</span></div>
  </section>

  <h2>Lanes</h2>
  <div class="grid" id="lanes"></div>

  <h2>This week</h2>
  <div class="week" id="week"></div>

  <h2>Inbox from Elodie</h2>
  <div class="card" id="elodie"></div>

  <footer id="foot"></footer>
</div>
<script>
(() => {
  const API = "https://amy-dashboard-ticks.sullivanamy75.workers.dev";
  const DONE_KEY = "amy-day-v2-done", OUT_KEY = "amy-day-v2-outbox";
  const QUOTES = [ { t: "How we spend our days is, of course, how we spend our lives.", by: "Annie Dillard" },{ t: "Start where you are. Use what you have. Do what you can.", by: "Arthur Ashe" },{ t: "You do not rise to the level of your goals. You fall to the level of your systems.", by: "James Clear" },{ t: "It always seems impossible until it's done.", by: "Nelson Mandela" },{ t: "The best way out is always through.", by: "Robert Frost" },{ t: "You can do anything, but not everything.", by: "David Allen" },{ t: "Focus on being productive instead of busy.", by: "Tim Ferriss" },{ t: "Action isn't just the effect of motivation; it's also the cause of it.", by: "Mark Manson" },{ t: "Nothing is so fatiguing as the eternal hanging on of an uncompleted task.", by: "William James" },{ t: "Just five minutes. You're allowed to quit after five minutes. (You won't.)", by: "the Frog" },{ t: "Well done is better than well said.", by: "Benjamin Franklin" },{ t: "Success is the sum of small efforts, repeated day in and day out.", by: "Robert Collier" },{ t: "Finish each day and be done with it. You have done what you could.", by: "Ralph Waldo Emerson" },{ t: "Tomorrow is always fresh, with no mistakes in it.", by: "L. M. Montgomery" },{ t: "Don't count the days; make the days count.", by: "Muhammad Ali" },{ t: "Momentum or it dies. Small daily touches count.", by: "house rule" },{ t: "Receipts beat vibes.", by: "house motto" } ];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const device = /iPhone|iPad/.test(navigator.userAgent) ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android" : /Mac/.test(navigator.userAgent) ? "Mac" : "browser";

  let data = null;
  let done = load(DONE_KEY, {});
  let outbox = load(OUT_KEY, []);
  const labels = {};

  function setSync(state, text) {
    document.getElementById("sdot").className = "dot " + (state || "");
    document.getElementById("stext").textContent = text;
  }

  // quotes
  let qi = Math.floor(Date.now() / 1200000) % QUOTES.length;
  function paintQuote() {
    const q = document.getElementById("quote"), it = QUOTES[qi % QUOTES.length];
    q.style.opacity = 0;
    setTimeout(() => { q.innerHTML = esc(it.t) + "<cite>" + esc(it.by) + "</cite>"; q.style.opacity = 1; }, 200);
  }
  document.getElementById("quote-next").onclick = () => { qi++; paintQuote(); };
  setInterval(() => { qi++; paintQuote(); }, 1200000);
  paintQuote();

  const taskHtml = (t, lane) => {
    labels[t.id] = { label: t.text, lane };
    return '<button type="button" class="task' + (done[t.id] ? " done" : "") + '" data-id="' + esc(t.id) + '">' +
      '<span class="box"></span><span><span class="label">' + esc(t.text) + '</span>' +
      (t.note ? '<span class="note">' + esc(t.note) + '</span>' : "") + '</span></button>';
  };

  function render() {
    if (!data) return;
    document.getElementById("kicker").textContent = data.kicker || "";
    document.getElementById("heading").textContent = data.heading || "Amy — today";
    document.getElementById("msg").textContent = data.message || "";
    const f = data.frog;
    document.getElementById("frog").innerHTML = f ? '<div class="kicker">🐸 Today\'s frog · eat it first</div>' + taskHtml(f, "frog") : "";
    document.getElementById("frog").style.display = f ? "" : "none";
    document.getElementById("today").innerHTML = (data.today || []).map((t) => taskHtml(t, "today")).join("");
    document.getElementById("lanes").innerHTML = (data.lanes || []).map((l) => {
      const n = l.tasks.length, d = l.tasks.filter((t) => done[t.id]).length;
      return '<div class="card"><div class="lane-h"><b>' + esc(l.emoji + " " + l.name) + '</b>' +
        (l.tag ? '<span class="tag">' + esc(l.tag) + '</span>' : "") +
        (n ? '<span class="count">' + d + " of " + n + " done</span>" : "") + '</div>' +
        l.tasks.map((t) => taskHtml(t, l.id)).join("") +
        (((l.waiting || []).length + (l.facts || []).length) ? '<ul class="facts">' +
          (l.waiting || []).map((w) => '<li class="wait">' + esc(w) + "</li>").join("") +
          (l.facts || []).map((w) => "<li>" + esc(w) + "</li>").join("") + "</ul>" : "") + "</div>";
    }).join("");
    document.getElementById("week").innerHTML = (data.week || []).map((d) =>
      '<div class="day' + (d.today ? " today" : "") + '"><span class="d">' + esc(d.day) + '</span><span class="dt">' + esc(d.date) + "</span>" +
      "<ul>" + d.items.map((i) => "<li>" + esc(i) + "</li>").join("") + "</ul>" +
      (d.trash ? '<div class="trash">🗑️ trash night, after 5</div>' : "") + "</div>").join("");
    const el = data.elodie || [];
    document.getElementById("elodie").innerHTML = el.length ? el.map((t) => taskHtml(t, "elodie")).join("")
      : '<div class="empty">Nothing from Elodie yet. When she emails her task list, Riley adds the tasks here and you can tick them like the rest.</div>';
    document.getElementById("foot").textContent = "Updated " + new Date(data.updated).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) + " · ticks save on this device and sync to Riley";
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest(".task"); if (!b) return;
    const id = b.dataset.id, now = !done[id];
    if (now) done[id] = new Date().toISOString(); else delete done[id];
    save(DONE_KEY, done);
    const meta = labels[id] || {};
    outbox.push({ id, label: meta.label || id, lane: meta.lane || "", done: now, device });
    save(OUT_KEY, outbox);
    render(); flush();
  });

  let flushing = false;
  async function flush() {
    if (flushing) return; flushing = true;
    try {
      while (outbox.length) {
        const r = await fetch(API + "/tick", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(outbox[0]) });
        if (!r.ok) throw new Error("tick " + r.status);
        outbox.shift(); save(OUT_KEY, outbox);
      }
      setSync("ok", "Saved · Riley can see it");
    } catch {
      setSync("wait", "Saved on this device · will sync when online");
    } finally { flushing = false; }
  }

  async function pullState() {
    if (outbox.length) return flush();
    try {
      const r = await fetch(API + "/state", { cache: "no-store" });
      const j = await r.json();
      if (j && j.done && !outbox.length) { done = j.done; save(DONE_KEY, done); render(); }
      setSync("ok", "Saved · Riley can see it");
    } catch { setSync("wait", "Saved on this device · will sync when online"); }
  }

  document.getElementById("pickbtn").onclick = () => {
    const q = (data && data.quick) || [];
    if (!q.length) return;
    document.getElementById("pick").textContent = "Your 10-minute win: " + q[Math.floor(Math.random() * q.length)];
    document.getElementById("pickbtn").textContent = "Pick another";
  };

  async function boot() {
    try {
      const r = await fetch("./data.json?t=" + Date.now(), { cache: "no-store" });
      data = await r.json(); save("amy-day-v2-data", data);
    } catch { data = load("amy-day-v2-data", null); }
    render(); pullState();
  }
  boot();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { boot(); } });
  window.addEventListener("online", flush);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
})();
</script>
</body>
</html>
